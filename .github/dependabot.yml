version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Kolkata
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Kolkata
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # @types/node tracks the runtime major in .nvmrc; move both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
